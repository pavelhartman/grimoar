<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070301">
<title>Krvavý grimoár – Tabula Honoris</title>
<style>
:root{
  --bg:#050201;--ink:#ead8aa;--muted:#bca77f;--gold:#c89031;--gold2:#f2cf76;
  --gold3:#7b4d18;--blood:#7e1712;--blood2:#3e0806;--parch:#d6b27a;--parch2:#9c6b39;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:Georgia,"Times New Roman",serif;
  background:
    radial-gradient(circle at 50% -10%,rgba(126,20,13,.34),transparent 31rem),
    radial-gradient(circle at 7% 40%,rgba(196,145,54,.07),transparent 25rem),
    linear-gradient(180deg,#0f0704 0,#060302 55%,#020101 100%);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;z-index:-1;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px)
}
.page{width:min(100%,980px);margin:auto;padding:0 12px 56px}

/* Originální titulní nápis dodaný uživatelem. */
.title-crop{
  position:relative;width:min(100%,941px);margin:0 auto;padding:18px 16px 16px;
  overflow:hidden;background:
    radial-gradient(circle at 50% 0,rgba(104,16,12,.25),transparent 25rem),
    linear-gradient(180deg,#080403,#040201);
  border-left:1px solid #68451f;border-right:1px solid #68451f;
  box-shadow:0 18px 45px #000b;text-align:center
}
.title-logo{
  display:block;width:min(100%,760px);height:auto;margin:0 auto;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.75));
}
.title-crop:after{
  content:"";position:absolute;left:6%;right:6%;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,#8d1d16 22%,#d3a145 50%,#8d1d16 78%,transparent)
}

.chronicle{
  position:relative;margin-top:-1px;padding:24px 18px 30px;border:1px solid #9c6a2a;
  background:
    radial-gradient(circle at 50% 0,rgba(119,19,13,.19),transparent 24rem),
    linear-gradient(145deg,rgba(20,11,7,.985),rgba(5,3,2,.995));
  box-shadow:0 24px 60px #000b,inset 0 0 0 5px rgba(5,3,2,.83),inset 0 0 0 6px rgba(205,153,58,.14)
}
.chronicle:before{content:"";position:absolute;inset:9px;border:1px solid rgba(218,167,72,.17);pointer-events:none}
.chronicle>*{position:relative;z-index:1}
.eyebrow{text-align:center;color:#c99e4d;font-size:.72rem;letter-spacing:.23em;text-transform:uppercase}
h1{margin:6px 0 4px;text-align:center;color:var(--gold2);font-size:clamp(2.35rem,8vw,5rem);line-height:.94;text-transform:uppercase;text-shadow:0 3px 0 #4d200d,0 12px 30px #000}
.subtitle{text-align:center;color:#d4b978;font-style:italic;margin:10px auto 18px;max-width:660px}
.ornament{height:15px;margin:15px auto 18px;width:min(420px,78%);background:linear-gradient(90deg,transparent,#8d1d16 19%,#d3a145 49%,#8d1d16 81%,transparent);clip-path:polygon(0 46%,43% 46%,46% 0,50% 44%,54% 0,57% 46%,100% 46%,100% 54%,57% 54%,54% 100%,50% 56%,46% 100%,43% 54%,0 54%)}

.tabs{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:4px 0 20px}
.tab{
  min-width:108px;padding:12px 16px;border:1px solid #865b26;background:linear-gradient(#190c08,#080403);
  color:#d8ba73;font:700 .88rem Georgia,serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  box-shadow:inset 0 0 0 2px #070302
}
.tab.active{border-color:#d0a048;background:linear-gradient(#8c241d,#4c0d09);color:#ffe6a0;box-shadow:inset 0 0 0 2px #170604,0 0 18px rgba(166,47,27,.2)}

.record-seal{
  display:none;position:relative;max-width:700px;margin:4px auto 22px;padding:16px 18px 15px;text-align:center;
  border:1px solid #b37c2d;background:radial-gradient(circle at 50% 50%,#54120e 0,#260806 58%,#0b0403 100%);
  box-shadow:0 12px 28px #0009,inset 0 0 0 4px #120503,inset 0 0 0 5px rgba(229,181,77,.18)
}
.record-seal.show{display:block}.record-seal .label{color:#d9b15f;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase}.record-seal strong{display:block;margin-top:3px;color:#ffe08a;font-size:1.2rem}

.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0 auto 13px;max-width:840px;flex-wrap:wrap}
.meta{font-size:.8rem;color:#968469;font-style:italic}
.refresh{border:1px solid #775127;background:#0c0705;color:#cdb47a;padding:8px 11px;font:700 .76rem Georgia,serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}

.entries{display:grid;gap:14px;max-width:840px;margin:0 auto}
.entry{
  --accent:#8b652d;position:relative;display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:15px;align-items:center;
  padding:14px 16px 14px 14px;border:1px solid var(--accent);
  background:
    linear-gradient(90deg,rgba(211,165,70,.055),transparent 27%),
    linear-gradient(120deg,#130b07,#080403 72%);
  box-shadow:0 12px 28px #0008,inset 0 0 0 3px #080403,inset 0 0 0 4px rgba(204,151,57,.08)
}
.entry:before{content:"";position:absolute;left:84px;top:10px;bottom:10px;width:1px;background:linear-gradient(transparent,rgba(208,158,63,.26),transparent)}
.entry.first{--accent:#d5a847;background:linear-gradient(90deg,rgba(173,125,37,.18),transparent 38%),linear-gradient(120deg,#1b0d07,#080403 75%)}
.entry.second{--accent:#9f987e}.entry.third{--accent:#9e673c}
.place{
  position:relative;width:52px;height:52px;margin:auto;display:grid;place-items:center;border-radius:50%;
  border:2px solid var(--accent);background:#0b0604;color:#f0d278;font-weight:bold;font-size:1.23rem;
  box-shadow:inset 0 0 18px #000,0 0 16px rgba(211,163,69,.12)
}
.place:after{content:"";position:absolute;inset:5px;border:1px solid rgba(236,194,94,.22);border-radius:50%}
.team{min-width:0}
.team-name{color:#f0ddb1;font-size:clamp(1.06rem,3.9vw,1.42rem);font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.faction-line{display:flex;align-items:center;gap:8px;margin-top:5px;color:#c6aa73;font-size:.81rem}
.emblem{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;color:#e4bf67}
.emblem svg{display:block;width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 4px #000)}
.subline{margin-top:5px;color:#9f8c6b;font-size:.75rem;display:flex;gap:8px;flex-wrap:wrap}
.timebox{text-align:right;white-space:nowrap;padding-left:10px}
.final-time{color:#f0cb66;font-weight:bold;font-size:clamp(1.15rem,4.3vw,1.62rem);font-variant-numeric:tabular-nums}.time-label{margin-top:2px;color:#8f7c5d;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}

.empty,.error{max-width:840px;margin:auto;padding:28px 16px;text-align:center;border:1px solid #62421f;background:#0b0604;color:#bca77c}.error{color:#e6aaa3;border-color:#7f2a23}
.footer{text-align:center;margin:19px auto 0;color:#75664e;font-size:.75rem}

@media(max-width:620px){
  .page{padding-left:0;padding-right:0}.title-crop{border-left:0;border-right:0;padding:12px 8px 10px}.chronicle{border-left:0;border-right:0;padding:20px 10px 25px}
  .entry{grid-template-columns:55px minmax(0,1fr);gap:10px;padding:12px 10px}.entry:before{left:67px}.place{width:44px;height:44px;font-size:1rem}.timebox{grid-column:2;text-align:left;padding-left:0;margin-top:-2px}.final-time{font-size:1.18rem}.time-label{display:inline;margin-left:7px}.faction-line{font-size:.77rem}.emblem{width:27px;height:27px;flex-basis:27px}.emblem svg{width:25px;height:25px}.subline{font-size:.71rem}.toolbar{padding:0 4px}
}
</style>
</head>

      <div class="team-name">${esc(r.tym)}</div>
      <div class="faction-line"><span class="emblem">${icons[r.frakce]||''}</span><span>${esc(r.frakce)}</span></div>
      <div class="subline"><span>${prettyDate(r.datum)}</span><span>čistý čas ${fmt(r.cisty_cas_sec)}</span><span>penalizace +${esc(r.penalizace_min)} min</span></div>
    </div>
    <div class="timebox"><div class="final-time">${fmt(r.vysledny_cas_sec)}</div><div class="time-label">výsledný čas</div></div>
  </article>`).join('');
  meta.textContent=`${mode==='today'?'Dnešní pořadí':mode==='week'?'Posledních 7 dní':'Historické pořadí'} · ${data.length} ${data.length===1?'družina':data.length>=2&&data.length<=4?'družiny':'družin'} · aktualizováno ${new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'})}`;
 }catch(e){entries.innerHTML='<div class="error">Výsledky se nepodařilo načíst. Zkontrolujte připojení nebo nastavení Supabase.</div>';meta.textContent='Načtení se nezdařilo'}
 finally{loading=false;refresh.disabled=false}
}
tabs.forEach(t=>t.addEventListener('click',()=>{mode=t.dataset.mode;tabs.forEach(x=>x.classList.toggle('active',x===t));load()}));
refresh.addEventListener('click',load);load();setInterval(load,20000);
})();
</script>
</body>
</html>
