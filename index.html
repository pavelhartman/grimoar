<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<meta name="theme-color" content="#070403">
<title>Krvavý grimoár – finální verze</title>
<style>
:root{
  --bg:#070403;--bg2:#120806;--gold:#c99635;--gold2:#f2d17b;--blood:#731713;--blood2:#a32720;
  --paper:#ead8aa;--paper2:#c99c61;--ink:#2a180d;--cream:#f2dfb6;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050302;color:#ead7aa;font-family:Georgia,"Times New Roman",serif;overflow-anchor:none}
body{background:radial-gradient(circle at 50% -12%,rgba(123,25,17,.23),transparent 34rem),linear-gradient(#0b0504,#040202 75%)}
button,input{font:inherit}
button{touch-action:manipulation}
.app{width:min(100%,941px);margin:0 auto;min-height:100vh;background:#050302}
.screen{display:none;min-height:100vh;position:relative}.screen.active{display:block}
.screen.padded{padding:18px 14px 42px}
.art{position:relative;width:100%;margin:0 auto}.art>img{display:block;width:100%;height:auto}
.hot{position:absolute;border:0;background:transparent;cursor:pointer;z-index:3}
.hot:focus-visible{outline:2px solid rgba(242,209,123,.85);outline-offset:-3px}
.backline{display:inline-flex;align-items:center;gap:7px;color:#e1b95f;text-decoration:none;margin:4px 0 14px;cursor:pointer;font-weight:700}

/* title */
#title .hot-enter{left:20.5%;top:84.1%;width:59%;height:7.7%}
.age{text-align:center;padding:10px 12px 17px;font-size:.78rem;color:#ccb780;background:#050302}

/* faction select */
#faction .art{max-width:760px}
.faction-hit{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:8px}
.faction-hit:focus-visible{outline:2px solid #efd174;outline-offset:-3px}

/* confirm */
#confirm{padding:0;background:#050302}
.confirm-wrap{position:relative;width:100%;max-width:760px;margin:0 auto}.confirm-wrap>img{display:block;width:100%}
#teamName{position:absolute;left:15.4%;top:57.95%;width:67.4%;height:3.45%;z-index:3;border:0;background:rgba(6,4,3,.985);color:#f4dfb3;padding:0 2.2%;text-align:left;font-size:clamp(.92rem,2.75vw,1.16rem);line-height:1.1;text-transform:none;box-shadow:inset 0 0 10px #000b;outline:none;border-radius:0}#teamName::placeholder{color:#d8c3a0;opacity:.9}
.confirm-go{left:13.4%;top:70.55%;width:73.2%;height:6.8%}.confirm-back{left:22.2%;top:79.2%;width:55.6%;height:5.7%}

/* profile */
#profile,#legend,#legend2,#legend3,#howto,#home{padding:0;background:#050302}
.profile-next{left:11.5%;top:87.35%;width:77%;height:6.65%}

/* legend + howto */
#legend .next{left:21%;top:85%;width:58%;height:7.5%}
#legend2 .next{left:24%;top:84.1%;width:52%;height:6.9%}
#legend2 .backhot{left:36%;top:91.2%;width:28%;height:5.4%}
#legend3 .howto{left:16%;top:91.1%;width:32%;height:5.7%}
#legend3 .start{left:49%;top:91.1%;width:38%;height:5.7%}
#legend3 .parch{left:29%;top:83.35%;width:58%;height:4.7%}
#legend3 .legend-live-back{position:absolute;left:2.2%;top:2.1%;z-index:5;border:1px solid #b88634;background:linear-gradient(#21130b,#0c0705);color:#efd394;padding:8px 14px;font-weight:700;letter-spacing:.04em;cursor:pointer;box-shadow:0 5px 14px #0008}
#howto .start{left:6%;top:89.1%;width:58%;height:7%}
#howto .backhot{left:66%;top:89.1%;width:29%;height:7%}

/* home location */
/* CONTROL PACKAGE: first/home location intentionally has no back-to-HUB control. */
#home .art{max-width:941px}
.home-verify{left:16%;top:77.3%;width:68%;height:8.2%}
.home-skip{left:20%;top:86.7%;width:60%;height:4.4%}
.home-clues{position:absolute;left:4.8%;right:4.8%;top:69.05%;display:grid;grid-template-columns:repeat(5,1fr);gap:0;z-index:4;pointer-events:none;text-align:center;color:#f2e3c0;text-shadow:0 2px 3px #000,0 0 6px #000;font-size:clamp(.66rem,2.45vw,1.34rem);line-height:1.05}
.home-clues span{display:block;white-space:nowrap;transform:none}
.home-reread{position:absolute;left:2.4%;top:1.05%;z-index:6;width:21.5%;height:5.1%;border:0;background:url("assets/popup_button_secondary.webp") center/100% 100% no-repeat;color:#f5dda3;padding:0 7px;font-family:Georgia,'Times New Roman',serif;font-size:clamp(.58rem,2.15vw,.95rem);font-weight:700;letter-spacing:.035em;cursor:pointer;text-shadow:0 2px 2px #000;text-transform:uppercase;-webkit-tap-highlight-color:transparent}.home-reread:hover,.home-reread:focus-visible{filter:brightness(1.12);outline:none}.home-reread:active{transform:translateY(1px)}
.haviri-znacky-badge{position:absolute;right:1.5%;top:1.2%;z-index:12;width:22%;border:0;background:transparent;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 6px 12px rgba(0,0,0,.72))}.haviri-znacky-badge img{display:block;width:100%;height:auto;pointer-events:none}


.prototype-note{max-width:700px;margin:12px auto 26px;padding:10px 12px;border:1px solid #68461f;background:#0f0906;color:#cdb887;text-align:center;font-size:.85rem}
.test-confirm{display:none;max-width:700px;margin:10px auto 30px;width:calc(100% - 28px);padding:12px;border:1px solid #9a6d2f;background:#211108;color:#f1d077;font-weight:700;cursor:pointer}
.test-on .test-confirm{display:block}

/* popup – asset based master, no extra frames or fills */
.popup{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.popup.show{display:flex}
.popup-card{position:relative;width:min(94vw,820px);max-height:92vh;overflow:auto;padding:124px 78px 58px;text-align:center;color:#27160d;font-family:Georgia,"Times New Roman",serif;background:url("assets/popup_parchment_bg.webp") center/100% 100% no-repeat;filter:drop-shadow(0 26px 44px rgba(0,0,0,.66))}
.popup-seal{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:118px;height:118px;display:grid;place-items:center;z-index:4;background:none;border:0;box-shadow:none}
.popup-seal img{display:block;width:100%;height:100%;object-fit:contain}
.popup-title{margin:0 0 12px;color:#74160f;font-size:clamp(2rem,5.6vw,3.35rem);line-height:1.02;text-transform:uppercase;letter-spacing:.018em;text-shadow:none}
.popup-title:after{content:"◆";display:block;margin:10px auto 0;font-size:.72rem;color:#9b5a27}
.popup-body{max-width:88%;margin:0 auto;font-size:clamp(1.08rem,2.8vw,1.65rem);line-height:1.42}
.popup-body p{margin:.62em 0}.popup-body b{color:#72160f}.popup-body small{font-size:.82em;color:#5a4630}
.popup-actions{display:grid;gap:14px;justify-items:center;margin-top:26px}.popup-actions.two{grid-template-columns:1fr 1fr;align-items:center}.popup-actions.two .popup-btn{width:100%}
.popup-btn{position:relative;display:block;width:min(86%,590px);min-height:66px;padding:17px 58px;border:0;background:url("assets/popup_button_primary.webp") center/100% 100% no-repeat;color:#f6df9d;font-weight:700;font-size:clamp(1.1rem,2.8vw,1.65rem);line-height:1.05;text-transform:uppercase;letter-spacing:.035em;cursor:pointer;text-shadow:0 2px 2px #430806;box-shadow:none}
.popup-btn.secondary{background-image:url("assets/popup_button_secondary.webp");color:#ecd8ad}
.popup-btn:hover,.popup-btn:focus-visible{filter:brightness(1.07);outline:none}
@media(max-width:520px){.popup{padding:6px}.popup-card{width:98vw;padding:104px 34px 40px}.popup-seal{top:8px;width:96px;height:96px}.popup-title{font-size:clamp(1.75rem,8vw,2.6rem)}.popup-body{max-width:94%;font-size:clamp(1rem,4.5vw,1.35rem)}.popup-actions.two{grid-template-columns:1fr}.popup-btn{width:94%;min-height:58px;padding:14px 38px}}


/* HUB – approved art; first location completion overlay */
#hub .hub-wrap{position:relative;width:100%;max-width:941px;margin:0 auto;background:#050302}
#hub .hub-wrap>img{display:block;width:100%;height:auto}
.hub-status{position:absolute;z-index:4;left:10.5%;right:10.5%;top:15.1%;height:6.7%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 2.8%;color:#f1d390;text-shadow:0 2px 4px #000;pointer-events:none}.hub-status b{font-size:clamp(.9rem,3.8vw,1.5rem)}.hub-status span{font-size:clamp(.78rem,3vw,1.15rem);font-weight:700}
.hub-radovi-done{position:absolute;z-index:5;left:9.8%;top:32.6%;width:38.6%;height:16.9%;pointer-events:none}.hub-radovi-done .check{position:absolute;left:3%;top:3%;width:clamp(34px,8vw,54px);height:clamp(34px,8vw,54px);border-radius:50%;display:grid;place-items:center;border:2px solid #f1d25f;background:rgba(9,5,3,.92);color:#ffe77c;font-size:clamp(1.25rem,5vw,2rem);box-shadow:0 0 16px rgba(231,188,66,.5)}.hub-radovi-done .code{position:absolute;right:3%;top:3%;padding:4px 10px;border:2px solid #e8c24d;background:rgba(8,5,3,.94);color:#ffe27a;font-weight:700;font-size:clamp(.9rem,3.5vw,1.35rem);box-shadow:0 0 14px rgba(231,188,66,.35)}
@media(max-width:520px){.task-order li{font-size:.72rem}.task-order .arrows button{min-width:28px;padding:1px 5px}.alt-grid{grid-template-columns:1fr}.task-live{padding-left:8px;padding-right:8px}}

/* hidden test badge */
.test-badge{display:none;position:fixed;right:8px;top:8px;z-index:1500;padding:5px 8px;background:#130906;border:1px solid #b9842f;color:#f0cf72;font-size:11px;font-weight:700}.test-on .test-badge{display:block}

/* ===== RADOVI TASK FLOW v3: approved art + unobtrusive interactive controls ===== */
#task{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.radovi-card{position:relative;width:min(941px,100%);margin:0 auto;background:#050302;filter:drop-shadow(0 18px 34px rgba(0,0,0,.68))}
.radovi-card>img{display:block;width:100%;height:auto}
.radovi-hot{position:absolute;z-index:30;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* Řádoví: the original illustrated rows stay visible. Only the illustrated icon+name strips move; no CSS row boxes are drawn over the artwork. */
.radovi-strip{position:absolute;z-index:22;left:18.6%;width:64.3%;height:4.01%;object-fit:fill;pointer-events:none;filter:none;transition:top .14s ease}
.radovi-strip.r0{top:67.46%}.radovi-strip.r1{top:71.47%}.radovi-strip.r2{top:75.48%}.radovi-strip.r3{top:79.49%}.radovi-strip.r4{top:83.50%}
/* Klikaci plochy presne kopiruji dve sipky nad sebou v puvodni grafice. */
.radovi-arrow{position:absolute;z-index:34;left:83.35%;width:5.15%;height:1.72%;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0;margin:0;touch-action:manipulation}
.radovi-arrow.up.r0{top:67.52%}.radovi-arrow.down.r0{top:69.34%}
.radovi-arrow.up.r1{top:71.53%}.radovi-arrow.down.r1{top:73.35%}
.radovi-arrow.up.r2{top:75.54%}.radovi-arrow.down.r2{top:77.36%}
.radovi-arrow.up.r3{top:79.55%}.radovi-arrow.down.r3{top:81.37%}
.radovi-arrow.up.r4{top:83.56%}.radovi-arrow.down.r4{top:85.38%}
.radovi-arrow:focus-visible{outline:2px solid rgba(255,222,135,.72);outline-offset:-2px}
/* Cela graficka polozka je zaroven dotykovy drag-handle. Bez viditelneho HTML ramecku. */
.radovi-drag{position:absolute;z-index:32;left:18.6%;width:64.0%;height:4.01%;border:0;background:transparent;padding:0;margin:0;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent}
.radovi-drag.r0{top:67.46%}.radovi-drag.r1{top:71.47%}.radovi-drag.r2{top:75.48%}.radovi-drag.r3{top:79.49%}.radovi-drag.r4{top:83.50%}
.radovi-drag.dragging{cursor:grabbing}
.radovi-main-hint{left:5.8%;top:90.5%;width:42.6%;height:7.5%}
.radovi-main-check{left:50.2%;top:90.5%;width:44%;height:7.5%}
.radovi-hint-ok{left:24%;top:71.8%;width:52%;height:8.2%}
.radovi-correct-next{left:20%;top:74.5%;width:60%;height:8.8%}
.radovi-wrong-back{left:8.7%;top:67.5%;width:39.5%;height:8.8%}
.radovi-wrong-giveup{left:50.3%;top:67.5%;width:41%;height:8.8%}
.radovi-preseal-break{left:7%;top:88.2%;width:86%;height:8.4%}
.radovi-broken-hub{left:21%;top:79.3%;width:58%;height:8.3%}

/* Alternative answer after the hint — same gothic black/red/gold language as the task card. */
.radovi-answer-wrap{position:relative;width:min(760px,94%);margin:22px auto 56px;padding:22px 22px 20px;box-sizing:border-box;background:radial-gradient(circle at 50% 0,rgba(74,12,10,.62),transparent 44%),linear-gradient(180deg,#0b0706,#030303 72%);border:2px solid #c69435;outline:1px solid rgba(97,51,10,.85);outline-offset:-7px;box-shadow:0 16px 38px #000c,inset 0 0 34px rgba(111,54,14,.18);color:#f0d38a;font-family:Georgia,'Times New Roman',serif}
.radovi-answer-wrap:before,.radovi-answer-wrap:after{content:'◆';position:absolute;top:8px;color:#d9a53a;font-size:.7rem}.radovi-answer-wrap:before{left:10px}.radovi-answer-wrap:after{right:10px}
.radovi-answer-wrap h2{text-align:center;margin:0 0 18px;color:#f4df9f;font-size:clamp(1.35rem,5vw,2.05rem);letter-spacing:.035em;text-shadow:0 2px 2px #000}
.radovi-answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:17px}
.radovi-answer-grid label{display:block;text-align:center;color:#dcae52;font-weight:700;font-size:.82rem;letter-spacing:.05em}
.radovi-answer-grid input{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:13px 12px;background:linear-gradient(180deg,#080707,#0b0908);border:1.5px solid #c18c2d;box-shadow:inset 0 0 13px #000;color:#f4e7bd;text-align:center;font-family:Georgia,serif;font-size:1.18rem;text-transform:uppercase;outline:none}
.radovi-answer-grid input:focus{border-color:#e0bb60;box-shadow:inset 0 0 13px #000,0 0 0 1px rgba(232,193,99,.38)}
.radovi-answer-actions{display:grid;grid-template-columns:1fr 1.42fr;gap:12px}
.radovi-answer-actions button{min-height:58px;border:0;color:#f6e6bb;font-family:Georgia,serif;font-weight:700;font-size:clamp(.9rem,3.3vw,1.18rem);cursor:pointer;text-transform:uppercase;letter-spacing:.015em;text-shadow:0 2px 2px #000}
.radovi-answer-actions .hint{background:url("assets/popup_button_secondary.webp") center/100% 100% no-repeat}
.radovi-answer-actions .check{background:url("assets/popup_button_primary.webp") center/100% 100% no-repeat}
.radovi-answer-actions button:active{transform:translateY(1px)}
@media(max-width:520px){.radovi-answer-grid{gap:10px}.radovi-answer-actions{grid-template-columns:1fr 1.3fr}.radovi-answer-wrap{padding:18px 14px 16px}}


/* ===== ZTRACENY PERGAMEN ===== */
#parchment{padding:0;background:#050302}
.parchment-wrap{position:relative;width:100%;max-width:941px;margin:0 auto;background:#050302}
.parchment-wrap>img{display:block;width:100%;height:auto}
.parchment-back{left:17.0%;top:91.0%;width:20.7%;height:5.8%}
.parchment-check{left:39.1%;top:91.0%;width:41.7%;height:5.8%}
.parchment-solved{display:none;position:absolute;right:4%;top:2.2%;z-index:6;padding:8px 12px;background:rgba(8,5,3,.9);border:2px solid #d8aa3f;color:#f5d675;font-weight:700;letter-spacing:.05em;box-shadow:0 5px 16px #000a;text-transform:uppercase}
.parchment-solved.show{display:block}

.parchment-answer:focus{border-color:#d9ad4d;box-shadow:inset 0 0 16px #000b,0 0 0 2px rgba(217,173,77,.22)}
.hub-parch-hotspot{position:absolute;z-index:20;left:9.4%;width:81.2%;top:22.7%;height:9.1%;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;pointer-events:auto;touch-action:manipulation}

.hub-parch-status{position:absolute;z-index:21;left:36.0%;right:10.5%;top:27.35%;min-height:2.6%;display:flex;align-items:center;justify-content:center;text-align:center;color:#ead7a4;font-family:Georgia,"Times New Roman",serif;font-size:clamp(.62rem,2.35vw,1.05rem);font-weight:700;line-height:1.15;letter-spacing:.015em;text-shadow:0 2px 3px #000,0 0 7px #000;pointer-events:none}
.hub-parch-status.solved{color:#ffe07a;font-size:clamp(.72rem,2.7vw,1.18rem);letter-spacing:.05em}


/* ===== LAPKOVE HOME FLOW ===== */
.lapkove-card{position:relative;width:min(941px,100%);margin:0 auto;background:#050302;filter:drop-shadow(0 18px 34px rgba(0,0,0,.68))}
.lapkove-card>img{display:block;width:100%;height:auto}

.hub-radovi-hotspot{position:absolute;z-index:18;left:9.8%;top:32.6%;width:38.6%;height:16.9%;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* ===== ZVONICI FLOW ===== */

.zvonici-card>img{display:block;width:100%;height:auto}
.zvonici-hot{position:absolute;z-index:30;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.zvonici-story-back{display:none!important}
.zvonici-story-patch{position:absolute;z-index:26;left:0;top:0;width:45%;height:6.1%;pointer-events:none;background:linear-gradient(90deg,rgba(5,3,2,.99) 0%,rgba(5,3,2,.98) 72%,rgba(5,3,2,.72) 88%,transparent 100%)}
.zvonici-story-next{left:20%;top:89.3%;width:60%;height:6.6%}
.zvonici-task-hint{left:4.4%;top:90.0%;width:43.0%;height:7.5%}
.zvonici-task-check{left:49.0%;top:90.0%;width:46.0%;height:7.5%}

function preloadAssets(list){
  if(!Array.isArray(list)||!list.length)return;
  const run=()=>list.forEach(name=>{
    if(!name||PRELOADED_ASSETS.has(name))return;
    PRELOADED_ASSETS.add(name);
    const img=new Image();img.decoding='async';img.src=A+name;
  });
  if('requestIdleCallback' in window)requestIdleCallback(run,{timeout:1200});else setTimeout(run,80);
}

}

  sealImg.src=A+(ICONS[icon]||ICONS.alert);sealImg.alt='';t.textContent=title;b.innerHTML=html;a.innerHTML='';a.className='popup-actions'+(actions.length===2?' two':'');

let parchmentReturn='legend3';
function normAnswer(v){return String(v||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z]/g,'')}
function updateParchmentHubStatus(){
  const s=ensureGame(),el=document.getElementById('hubParchStatus'),hot=document.querySelector('.hub-parch-hotspot');if(!el)return;
  const doneCount=Object.keys(s.done||{}).length;
  if(s.parchment){
    const hideWord=!!(s.parchmentSurrendered&&doneCount<7);
    el.textContent=hideWord?'✓ VYŘEŠENO':'✓ VYŘEŠENO · OPĚT';el.classList.add('solved');
    if(hot){hot.disabled=true;hot.setAttribute('aria-disabled','true');hot.style.pointerEvents='none';hot.style.cursor='default'}
  }else{
    el.textContent='Lze rozluštit kdykoli během hry.';el.classList.remove('solved');
    if(hot){hot.disabled=false;hot.removeAttribute('aria-disabled');hot.style.pointerEvents='auto';hot.style.cursor='pointer'}
  }
}
function openParchment(from){parchmentReturn=from||'legend3';const s=ensureGame();if(from==='hub'&&s.parchment){openHub();return}document.getElementById('parchmentSolved')?.classList.toggle('show',!!s.parchment);show('parchment')}
function returnFromParchment(){if(parchmentReturn==='hub'){openHub()}else{show('legend3')}}
function openParchmentAnswer(){
  const s=ensureGame();
  if(s.parchment){const doneCount=Object.keys(s.done||{}).length;if(s.parchmentSurrendered&&doneCount<7){popup({icon:'scroll',title:'PERGAMEN JE VYŘEŠENÝ',html:'<p>Útržek se počítá jako dokončený.</p><p>Jeho indicie se odhalí, až dokončíte všech sedm lokací.</p>',actions:[{label:'ROZUMÍM',fn:returnFromParchment}]});return}popup({icon:'scroll',title:'SPRÁVNĚ. SLOVO MÁTE.',html:'<p><b>OPĚT</b></p><p>Slovo máte. Co znamená, zatím neřešte. Schovejte si ho. Budete ho ještě potřebovat.</p>',actions:[{label:'ROZUMÍM',fn:returnFromParchment}]});return}
  const actions=[];
  if(s.parchmentHintUnlocked)actions.push({label:'NÁPOVĚDA',kind:'secondary',fn:showParchmentHint});
  actions.push({label:'VZDÁT ODPOVĚĎ (+30 MIN)',kind:'secondary',fn:confirmParchmentSurrender});
  actions.push({label:'OVĚŘIT ODPOVĚĎ',fn:checkParchmentAnswer});

  setTimeout(()=>document.getElementById('parchmentAnswer')?.focus(),80)
}

  if(v==='OPET'){

    document.getElementById('parchmentSolved')?.classList.add('show');updateParchmentHubStatus();

  }

function distanceMeters(a,b,c,d){const R=6371000,p=Math.PI/180,x=(d-b)*p*Math.cos((a+c)*p/2),y=(c-a)*p;return Math.sqrt(x*x+y*y)*R}
function verifyHome(){const id=document.getElementById('homeArt').dataset.faction||currentFaction(),d=DATA[id];if(!d)return;if(!navigator.geolocation){popup({icon:'alert',title:'POLOHU NELZE OVĚŘIT',html:'<p>Prohlížeč GPS nepodporuje nebo k ní nemá přístup.</p>'});return}navigator.geolocation.getCurrentPosition(pos=>{const m=distanceMeters(pos.coords.latitude,pos.coords.longitude,d.gps[0],d.gps[1]);if(m<=25){homeSuccess(id)}else{if(id==='lapkove'){showLapkoveWrong()}else{popup({icon:'alert',title:'JEŠTĚ NEJSTE NA MÍSTĚ',html:`<p>${d.gpsNo}</p><p><small>Přibližná vzdálenost: ${Math.round(m)} m.</small></p>`})}}},()=>popup({icon:'alert',title:'POLOHU NELZE OVĚŘIT',html:'<p>Zkontrolujte oprávnění pro GPS. Na telefonu otevřete hru přímo v Chrome nebo Safari.</p>'}),{enableHighAccuracy:true,timeout:12000,maximumAge:5000})}

const RADOVI_CORRECT=['VĚŽ','RÝČ','LEV','VĚDRO S VODOU','LEBKA'];
let radoviWrongReturn='main';
function radoviOrder(){return ensureGame().radoviOrder}
function setRadoviOrder(order){const s=ensureGame();s.radoviOrder=order;saveGame(s)}
function moveRadovi(i,d){const o=[...radoviOrder()],j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];setRadoviOrder(o);renderRadoviOrder()}
const RADOVI_STRIPS={'LEBKA':'radovi_order/lebka.png','LEV':'radovi_order/lev.png','VĚDRO S VODOU':'radovi_order/vedro.png','VĚŽ':'radovi_order/vez.png','RÝČ':'radovi_order/ryc.png'};
let radoviDrag=null;
function radoviIndexFromClientY(clientY,host){
  const card=host.closest('.radovi-card');if(!card)return 0;
  const r=card.getBoundingClientRect();
  const rel=(clientY-r.top)/r.height*100;
  const centers=[69.465,73.475,77.485,81.495,85.505];
  let best=0,dist=Infinity;centers.forEach((c,i)=>{const d=Math.abs(rel-c);if(d<dist){dist=d;best=i}});
  return best;
}
function startRadoviDrag(e,i,name,el){
  if(e.pointerType==='mouse' && e.button!==0)return;
  e.preventDefault();e.stopPropagation();
  el.setPointerCapture?.(e.pointerId);el.classList.add('dragging');
  radoviDrag={pointerId:e.pointerId,index:i,name,el};
}
function moveRadoviDrag(e){
  if(!radoviDrag||e.pointerId!==radoviDrag.pointerId)return;
  e.preventDefault();
  const host=document.getElementById('radoviSortLayer');if(!host)return;
  const target=radoviIndexFromClientY(e.clientY,host);
  const current=radoviOrder().indexOf(radoviDrag.name);
  if(target!==current){
    const o=[...radoviOrder()];o.splice(current,1);o.splice(target,0,radoviDrag.name);setRadoviOrder(o);
    radoviDrag.index=target;renderRadoviOrder(radoviDrag.name,e.pointerId);
  }
}
function endRadoviDrag(e){
  if(!radoviDrag||e.pointerId!==radoviDrag.pointerId)return;
  e.preventDefault();radoviDrag.el?.classList.remove('dragging');radoviDrag=null;
}
function renderRadoviOrder(activeName=null,activePointerId=null){
  const host=document.getElementById('radoviSortLayer');if(!host)return;
  host.innerHTML='';
  radoviOrder().forEach((name,i)=>{
    const img=document.createElement('img');img.className=`radovi-strip r${i}`;img.src=A+RADOVI_STRIPS[name];img.alt=`${i+1}. ${name}`;host.appendChild(img);
    const drag=document.createElement('div');drag.className=`radovi-drag r${i}`;drag.setAttribute('role','button');drag.setAttribute('aria-label',`Přesunout ${name}. Táhněte prstem nahoru nebo dolů.`);
    drag.onpointerdown=e=>startRadoviDrag(e,i,name,drag);drag.onpointermove=moveRadoviDrag;drag.onpointerup=endRadoviDrag;drag.onpointercancel=endRadoviDrag;host.appendChild(drag);
    if(name===activeName && radoviDrag){radoviDrag.el=drag;radoviDrag.index=i;try{drag.setPointerCapture(activePointerId)}catch(_){}}
    const up=document.createElement('button');up.type='button';up.className=`radovi-arrow up r${i}`;up.setAttribute('aria-label',`Posunout ${name} nahoru`);up.onclick=e=>{e.preventDefault();e.stopPropagation();moveRadovi(i,-1)};host.appendChild(up);
    const down=document.createElement('button');down.type='button';down.className=`radovi-arrow down r${i}`;down.setAttribute('aria-label',`Posunout ${name} dolů`);down.onclick=e=>{e.preventDefault();e.stopPropagation();moveRadovi(i,1)};host.appendChild(down);
  });
}

function formatDuration(ms){ms=Math.max(0,Number(ms)||0);const sec=Math.floor(ms/1000),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')}

function saveMemorialCard(){
  const v=finalValues(),img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
    const ctx=c.getContext('2d');ctx.drawImage(img,0,0);
    // Stejna geometrie jako ziva karta .result-value:
    // right 16.8 %, width 31.5 %, padding-left 1.2 % z sirky pole, vyska 2.45 %.
    const tops=[0.6675,0.6955,0.7235,0.7515,0.7795,0.8075];
    const vals=[v.team,v.faction,v.date,v.clean,v.penalty,v.total];
    const x=c.width*(1-0.168-0.315+0.315*0.012);
    const rowHeight=c.height*0.0245;
    const fontPx=Math.round(c.width*(18.4/941));
    ctx.font=`${fontPx}px Georgia, serif`;
    ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillStyle='#ead8aa';
    tops.forEach((top,i)=>ctx.fillText(vals[i],x,top*c.height+rowHeight/2));
    c.toBlob(blob=>{
      if(!blob)return;
      const url=URL.createObjectURL(blob),a=document.createElement('a');
      a.download='Krvavy_grimoar_'+String(v.team).replace(/[^A-Za-z0-9_-]+/g,'_')+'.png';
      a.href=url;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1500)
    },'image/png')
  };
  img.src=A+'finis_vysledek.webp'
}

function checkHaviri(){const v=normWord(document.getElementById('haviriAnswer')?.value||'');if(v==='KUTNA')showHaviriCorrect();else popup({icon:'wrong',title:'CHYBNÉ ŘEŠENÍ',html:'<p>Zkuste to znovu. Písmena ve slepých chodbách do řešení nepatří.</p>',dismissible:false,actions:[{label:'ZPĚT K ÚKOLU',kind:'secondary',fn:()=>openHaviriTask()},{label:'VZDÁVÁM TO (+30 MIN)',fn:confirmHaviriSurrender}]})}
function confirmHaviriSurrender(){popup({icon:'hourglass',title:'OPRAVDU VZDÁT ÚKOL?',html:'<p>Úkol bude považován za splněný.</p><p><b>+30 MIN</b></p>',actions:[{label:'ZPĚT',kind:'secondary',fn:()=>openHaviriTask()},{label:'VZDÁVÁM TO',fn:()=>{addPenalty(30,'surrender-haviri');const s=ensureGame();if(!s.surrendered||typeof s.surrendered!=='object'||Array.isArray(s.surrendered))s.surrendered={};s.surrendered.haviri=true;s.done.haviri='N7';saveGame(s);goHaviriHub()}}]})}
function showHaviriCorrect(){document.getElementById('taskContent').innerHTML=`<div class="alch-card"><img src="${A}haviri_correct.webp" alt="Havíři – pečeť havířů je vaše"><button class="alch-hot" style="left:14%;top:92.1%;width:72%;height:5.6%;" type="button" aria-label="Rozlomit pečeť" onclick="breakHaviriSeal()"></button></div>`;show('task');window.scrollTo(0,0)}
function goHaviriHub(){try{openHub()}catch(e){console.error('Haviri hub fallback',e);const s=ensureGame();show('hub');const st=document.getElementById('hubStatus');if(st)st.innerHTML=`<b>${s.team||'Družina'}</b><span>${Object.keys(s.done||{}).length}/7 pečetí</span>`;const d=document.getElementById('hubHaviriDone');if(d)d.hidden=!s.done.haviri;window.scrollTo(0,0)}}
function breakHaviriSeal(){const st=ensureGame();st.done.haviri='N7';saveGame(st);document.getElementById('taskContent').innerHTML=`<div class="alch-card"><img src="${A}haviri_broken.webp" alt="Rozlomená pečeť Havířů – N7"><button class="alch-hot" style="left:20%;top:81.35%;width:60%;height:7.0%;z-index:80" type="button" aria-label="K rozcestníku" onclick="goHaviriHub();return false;"></button></div>`;show('task');window.scrollTo(0,0)}


function closeGame(){const s=ensureGame();s.gameClosed=true;s.closedAt=Date.now();s.lastScreen='gameClosed';saveGame(s);show('gameClosed',{persist:false});setTimeout(()=>{try{window.close()}catch(_){ }},120)}
function restoreLastPosition(){const s=ensureGame();if(!s.startedAt)return false;if(s.gameClosed){show('gameClosed',{persist:false});return true}if(s.timedOut&&!s.endedAt){show('timeExpired',{persist:false});return true}if(!s.endedAt&&officialElapsed(s)>=GAME_LIMIT_MS){expireGame();return true}selected=s.faction||selected;locationEntryMode=s.locationEntryMode||'home';const id=s.lastScreen||'profile';if(id==='hub'){openHub();return true}if(id==='task'&&s.lastTaskHtml){if(s.lastTaskHtml.includes('id="radoviSortLayer"')){openRadoviTask();return true}document.getElementById('taskContent').innerHTML=s.lastTaskHtml;show('task',{persist:false});return true}if(id==='home'&&s.lastHomeFaction&&DATA[s.lastHomeFaction]){openHomeCard(s.lastHomeFaction);return true}if(id==='profile'&&DATA[s.faction]){document.getElementById('profileArt').src=A+DATA[s.faction].profile;document.getElementById('profileArt').alt='Frakční karta '+DATA[s.faction].name}if(id==='grimoarYours'){document.getElementById('finalFaction').textContent=DATA[s.faction]?.name||s.faction||'Frakce';document.getElementById('finalTeam').textContent=s.team||'Družina'}if(id==='finis')renderFinalResults();if(document.getElementById(id)){show(id,{persist:false});return true}openHub();return true}
setInterval(()=>{checkGameClock()},1000);

// Navigation
 document.querySelector('#title .hot-enter').onclick=enterGame;
 document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>show(x.dataset.go));
 document.querySelectorAll('[data-faction]').forEach(x=>x.onclick=()=>pickFaction(x.dataset.faction));
 document.querySelector('.confirm-back').onclick=()=>show('faction');
 document.querySelector('.confirm-go').onclick=confirmFaction;
 document.getElementById('teamName').addEventListener('keydown',e=>{if(e.key==='Enter')confirmFaction()});
 document.querySelector('.profile-next').onclick=()=>show('legend');
 document.querySelector('#legend .next').onclick=()=>show('legend2');
 document.querySelector('#legend2 .next').onclick=()=>show('legend3');
 document.querySelector('#legend2 .backhot').onclick=()=>show('legend');
 document.querySelector('#legend3 .legend-live-back').onclick=()=>show('legend2');
 document.querySelector('#legend3 .howto').onclick=()=>show('howto');
 document.querySelector('#legend3 .start').onclick=openFirstStop;
 document.querySelector('#howto .start').onclick=openFirstStop;
 document.querySelector('#howto .backhot').onclick=()=>show('legend3');
 document.querySelector('#legend3 .parch').onclick=()=>openParchment('legend3');
 document.querySelector('.parchment-back').onclick=returnFromParchment;
 document.querySelector('.parchment-check').onclick=openParchmentAnswer;
 document.querySelector('.hub-parch-hotspot').onclick=()=>openParchment('hub');
 document.querySelector('.home-reread').onclick=reopenFirstStop;
 document.querySelector('.home-verify').onclick=verifyHome;
 document.querySelector('.home-skip').onclick=skipGps;
 document.getElementById('testConfirm').onclick=()=>homeSuccess(document.getElementById('homeArt').dataset.faction||currentFaction());

// Optional fast faction test: ?test=1&f=haviri
if(qs.get('f')&&DATA[qs.get('f')]){selected=qs.get('f')}
restoreLastPosition();
</script>
</body>
