*{box-sizing:border-box}

#howto .backhot{left:66%;top:89.1%;width:29%;height:7%}

.home-clues span{display:block;white-space:nowrap;transform:none}

.prototype-note{max-width:700px;margin:12px auto 26px;padding:10px 12px;border:1px solid #68461f;background:#0f0906;color:#cdb887;text-align:center;font-size:.85rem}

/* popup – asset based master, no extra frames or fills */
.popup{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

.popup-card{position:relative;width:min(94vw,820px);max-height:92vh;overflow:auto;padding:124px 78px 58px;text-align:center;color:#27160d;font-family:Georgia,"Times New Roman",serif;background:url("assets/popup_parchment_bg.png") center/100% 100% no-repeat;filter:drop-shadow(0 26px 44px rgba(0,0,0,.66))}

.popup-seal img{display:block;width:100%;height:100%;object-fit:contain}

.popup-actions{display:grid;gap:14px;justify-items:center;margin-top:26px}.popup-actions.two{grid-template-columns:1fr 1fr;align-items:center}.popup-actions.two .popup-btn{width:100%}
.popup-btn{position:relative;display:block;width:min(86%,590px);min-height:66px;padding:17px 58px;border:0;background:url("assets/popup_button_primary.png") center/100% 100% no-repeat;color:#f6df9d;font-weight:700;font-size:clamp(1.1rem,2.8vw,1.65rem);line-height:1.05;text-transform:uppercase;letter-spacing:.035em;cursor:pointer;text-shadow:0 2px 2px #430806;box-shadow:none}

.popup-btn:hover,.popup-btn:focus-visible{filter:brightness(1.07);outline:none}

/* HUB – approved art; first location completion overlay */
#hub .hub-wrap{position:relative;width:100%;max-width:941px;margin:0 auto;background:#050302}
#hub .hub-wrap>img{display:block;width:100%;height:auto}
.hub-status{position:absolute;z-index:4;left:10.5%;right:10.5%;top:15.1%;height:6.7%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 2.8%;color:#f1d390;text-shadow:0 2px 4px #000;pointer-events:none}.hub-status b{font-size:clamp(.9rem,3.8vw,1.5rem)}.hub-status span{font-size:clamp(.78rem,3vw,1.15rem);font-weight:700}
.hub-radovi-done{position:absolute;z-index:5;left:9.8%;top:32.6%;width:38.6%;height:16.9%;pointer-events:none}.hub-radovi-done .check{position:absolute;left:3%;top:3%;width:clamp(34px,8vw,54px);height:clamp(34px,8vw,54px);border-radius:50%;display:grid;place-items:center;border:2px solid #f1d25f;background:rgba(9,5,3,.92);color:#ffe77c;font-size:clamp(1.25rem,5vw,2rem);box-shadow:0 0 16px rgba(231,188,66,.5)}.hub-radovi-done .code{position:absolute;right:3%;top:3%;padding:4px 10px;border:2px solid #e8c24d;background:rgba(8,5,3,.94);color:#ffe27a;font-weight:700;font-size:clamp(.9rem,3.5vw,1.35rem);box-shadow:0 0 14px rgba(231,188,66,.35)}
@media(max-width:520px){.task-order li{font-size:.72rem}.task-order .arrows button{min-width:28px;padding:1px 5px}.alt-grid{grid-template-columns:1fr}.task-live{padding-left:8px;padding-right:8px}}

/* hidden test badge */
.test-badge{display:none;position:fixed;right:8px;top:8px;z-index:1500;padding:5px 8px;background:#130906;border:1px solid #b9842f;color:#f0cf72;font-size:11px;font-weight:700}.test-on .test-badge{display:block}

/* ===== RADOVI TASK FLOW v3: approved art + unobtrusive interactive controls ===== */
#task{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.radovi-card{position:relative;width:min(941px,100%);margin:0 auto;background:#050302;filter:drop-shadow(0 18px 34px rgba(0,0,0,.68))}
.radovi-card>img{display:block;width:100%;height:auto}
.radovi-hot{position:absolute;z-index:30;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* Řádoví: the original illustrated rows stay visible. Only the illustrated icon+name strips move; no CSS row boxes are drawn over the artwork. */
.radovi-strip{position:absolute;z-index:22;left:18.6%;width:64.3%;height:4.01%;object-fit:fill;pointer-events:none;filter:none;transition:top .14s ease}
.radovi-strip.r0{top:67.46%}.radovi-strip.r1{top:71.47%}.radovi-strip.r2{top:75.48%}.radovi-strip.r3{top:79.49%}.radovi-strip.r4{top:83.50%}
/* Klikaci plochy presne kopiruji dve sipky nad sebou v puvodni grafice. */
.radovi-arrow{position:absolute;z-index:34;left:83.35%;width:5.15%;height:1.72%;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0;margin:0;touch-action:manipulation}
.radovi-arrow.up.r0{top:67.52%}.radovi-arrow.down.r0{top:69.34%}
.radovi-arrow.up.r1{top:71.53%}.radovi-arrow.down.r1{top:73.35%}
.radovi-arrow.up.r2{top:75.54%}.radovi-arrow.down.r2{top:77.36%}
.radovi-arrow.up.r3{top:79.55%}.radovi-arrow.down.r3{top:81.37%}
.radovi-arrow.up.r4{top:83.56%}.radovi-arrow.down.r4{top:85.38%}
.radovi-arrow:focus-visible{outline:2px solid rgba(255,222,135,.72);outline-offset:-2px}
/* Cela graficka polozka je zaroven dotykovy drag-handle. Bez viditelneho HTML ramecku. */
.radovi-drag{position:absolute;z-index:32;left:18.6%;width:64.0%;height:4.01%;border:0;background:transparent;padding:0;margin:0;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent}
.radovi-drag.r0{top:67.46%}.radovi-drag.r1{top:71.47%}.radovi-drag.r2{top:75.48%}.radovi-drag.r3{top:79.49%}.radovi-drag.r4{top:83.50%}
.radovi-drag.dragging{cursor:grabbing}
.radovi-main-hint{left:5.8%;top:90.5%;width:42.6%;height:7.5%}
.radovi-main-check{left:50.2%;top:90.5%;width:44%;height:7.5%}
.radovi-hint-ok{left:24%;top:71.8%;width:52%;height:8.2%}
.radovi-correct-next{left:20%;top:74.5%;width:60%;height:8.8%}
.radovi-wrong-back{left:8.7%;top:67.5%;width:39.5%;height:8.8%}
.radovi-wrong-giveup{left:50.3%;top:67.5%;width:41%;height:8.8%}
.radovi-preseal-break{left:7%;top:88.2%;width:86%;height:8.4%}
.radovi-broken-hub{left:21%;top:79.3%;width:58%;height:8.3%}

/* Alternative answer after the hint — same gothic black/red/gold language as the task card. */
.radovi-answer-wrap{position:relative;width:min(760px,94%);margin:22px auto 56px;padding:22px 22px 20px;box-sizing:border-box;background:radial-gradient(circle at 50% 0,rgba(74,12,10,.62),transparent 44%),linear-gradient(180deg,#0b0706,#030303 72%);border:2px solid #c69435;outline:1px solid rgba(97,51,10,.85);outline-offset:-7px;box-shadow:0 16px 38px #000c,inset 0 0 34px rgba(111,54,14,.18);color:#f0d38a;font-family:Georgia,'Times New Roman',serif}
.radovi-answer-wrap:before,.radovi-answer-wrap:after{content:'◆';position:absolute;top:8px;color:#d9a53a;font-size:.7rem}.radovi-answer-wrap:before{left:10px}.radovi-answer-wrap:after{right:10px}
.radovi-answer-wrap h2{text-align:center;margin:0 0 18px;color:#f4df9f;font-size:clamp(1.35rem,5vw,2.05rem);letter-spacing:.035em;text-shadow:0 2px 2px #000}
.radovi-answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:17px}
.radovi-answer-grid label{display:block;text-align:center;color:#dcae52;font-weight:700;font-size:.82rem;letter-spacing:.05em}
.radovi-answer-grid input{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:13px 12px;background:linear-gradient(180deg,#080707,#0b0908);border:1.5px solid #c18c2d;box-shadow:inset 0 0 13px #000;color:#f4e7bd;text-align:center;font-family:Georgia,serif;font-size:1.18rem;text-transform:uppercase;outline:none}
.radovi-answer-grid input:focus{border-color:#e0bb60;box-shadow:inset 0 0 13px #000,0 0 0 1px rgba(232,193,99,.38)}
.radovi-answer-actions{display:grid;grid-template-columns:1fr 1.42fr;gap:12px}
.radovi-answer-actions button{min-height:58px;border:0;color:#f6e6bb;font-family:Georgia,serif;font-weight:700;font-size:clamp(.9rem,3.3vw,1.18rem);cursor:pointer;text-transform:uppercase;letter-spacing:.015em;text-shadow:0 2px 2px #000}
.radovi-answer-actions .hint{background:url("assets/popup_button_secondary.png") center/100% 100% no-repeat}
.radovi-answer-actions .check{background:url("assets/popup_button_primary.png") center/100% 100% no-repeat}
.radovi-answer-actions button:active{transform:translateY(1px)}
@media(max-width:520px){.radovi-answer-grid{gap:10px}.radovi-answer-actions{grid-template-columns:1fr 1.3fr}.radovi-answer-wrap{padding:18px 14px 16px}}

</style>
</head>

function addPenalty(minutes,key){const s=ensureGame();s.penaltyFlags=s.penaltyFlags||{};if(key&&s.penaltyFlags[key])return false;if(key)s.penaltyFlags[key]=true;s.penaltyMinutes+=minutes;saveGame(s);return true}

function distanceMeters(a,b,c,d){const R=6371000,p=Math.PI/180,x=(d-b)*p*Math.cos((a+c)*p/2),y=(c-a)*p;return Math.sqrt(x*x+y*y)*R}
function verifyHome(){const id=document.getElementById('homeArt').dataset.faction||currentFaction(),d=DATA[id];if(!d)return;if(!navigator.geolocation){popup({icon:'alert',title:'POLOHU NELZE OVĚŘIT',html:'<p>Prohlížeč GPS nepodporuje nebo k ní nemá přístup.</p>'});return}navigator.geolocation.getCurrentPosition(pos=>{const m=distanceMeters(pos.coords.latitude,pos.coords.longitude,d.gps[0],d.gps[1]);if(m<=25){homeSuccess(id)}else{popup({icon:'alert',title:'JEŠTĚ NEJSTE NA MÍSTĚ',html:`<p>${d.gpsNo}</p><p><small>Přibližná vzdálenost: ${Math.round(m)} m.</small></p>`})}},()=>popup({icon:'alert',title:'POLOHU NELZE OVĚŘIT',html:'<p>Zkontrolujte oprávnění pro GPS. Na telefonu otevřete hru přímo v Chrome nebo Safari.</p>'}),{enableHighAccuracy:true,timeout:12000,maximumAge:5000})}

const RADOVI_CORRECT=['VĚŽ','RÝČ','LEV','VĚDRO S VODOU','LEBKA'];
let radoviWrongReturn='main';
function radoviOrder(){return ensureGame().radoviOrder}
function setRadoviOrder(order){const s=ensureGame();s.radoviOrder=order;saveGame(s)}
function moveRadovi(i,d){const o=[...radoviOrder()],j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];setRadoviOrder(o);renderRadoviOrder()}
const RADOVI_STRIPS={'LEBKA':'radovi_order/lebka.png','LEV':'radovi_order/lev.png','VĚDRO S VODOU':'radovi_order/vedro.png','VĚŽ':'radovi_order/vez.png','RÝČ':'radovi_order/ryc.png'};
let radoviDrag=null;
function radoviIndexFromClientY(clientY,host){
  const card=host.closest('.radovi-card');if(!card)return 0;
  const r=card.getBoundingClientRect();
  const rel=(clientY-r.top)/r.height*100;
  const centers=[69.465,73.475,77.485,81.495,85.505];
  let best=0,dist=Infinity;centers.forEach((c,i)=>{const d=Math.abs(rel-c);if(d<dist){dist=d;best=i}});
  return best;
}
function startRadoviDrag(e,i,name,el){
  if(e.pointerType==='mouse' && e.button!==0)return;
  e.preventDefault();e.stopPropagation();
  el.setPointerCapture?.(e.pointerId);el.classList.add('dragging');
  radoviDrag={pointerId:e.pointerId,index:i,name,el};
}
function moveRadoviDrag(e){
  if(!radoviDrag||e.pointerId!==radoviDrag.pointerId)return;
  e.preventDefault();
  const host=document.getElementById('radoviSortLayer');if(!host)return;
  const target=radoviIndexFromClientY(e.clientY,host);
  const current=radoviOrder().indexOf(radoviDrag.name);
  if(target!==current){
    const o=[...radoviOrder()];o.splice(current,1);o.splice(target,0,radoviDrag.name);setRadoviOrder(o);
    radoviDrag.index=target;renderRadoviOrder(radoviDrag.name,e.pointerId);
  }
}
function endRadoviDrag(e){
  if(!radoviDrag||e.pointerId!==radoviDrag.pointerId)return;
  e.preventDefault();radoviDrag.el?.classList.remove('dragging');radoviDrag=null;
}
function renderRadoviOrder(activeName=null,activePointerId=null){
  const host=document.getElementById('radoviSortLayer');if(!host)return;
  host.innerHTML='';
  radoviOrder().forEach((name,i)=>{
    const img=document.createElement('img');img.className=`radovi-strip r${i}`;img.src=A+RADOVI_STRIPS[name];img.alt=`${i+1}. ${name}`;host.appendChild(img);
    const drag=document.createElement('div');drag.className=`radovi-drag r${i}`;drag.setAttribute('role','button');drag.setAttribute('aria-label',`Přesunout ${name}. Táhněte prstem nahoru nebo dolů.`);
    drag.onpointerdown=e=>startRadoviDrag(e,i,name,drag);drag.onpointermove=moveRadoviDrag;drag.onpointerup=endRadoviDrag;drag.onpointercancel=endRadoviDrag;host.appendChild(drag);
    if(name===activeName && radoviDrag){radoviDrag.el=drag;radoviDrag.index=i;try{drag.setPointerCapture(activePointerId)}catch(_){}}
    const up=document.createElement('button');up.type='button';up.className=`radovi-arrow up r${i}`;up.setAttribute('aria-label',`Posunout ${name} nahoru`);up.onclick=e=>{e.preventDefault();e.stopPropagation();moveRadovi(i,-1)};host.appendChild(up);
    const down=document.createElement('button');down.type='button';down.className=`radovi-arrow down r${i}`;down.setAttribute('aria-label',`Posunout ${name} dolů`);down.onclick=e=>{e.preventDefault();e.stopPropagation();moveRadovi(i,1)};host.appendChild(down);
  });
}
